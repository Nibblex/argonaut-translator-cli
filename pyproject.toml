[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argonaut-translator-cli"
dynamic = ["version"]
description = "Offline document translator for the command line (Argos Translate and NLLB-200)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Sergio Rodríguez", email = "srodriguez3441@gmail.com" },
]
# current pymupdf wheels need 3.10; CI tests every version listed below
requires-python = ">=3.10"
keywords = ["translation", "documents", "offline", "argos-translate", "nllb", "pdf", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "argos-translate-lt",
    "argos-translate-files>=1.4.4",
    "langdetect",
    "pymupdf",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Nibblex/argonaut-translator-cli"
Issues = "https://github.com/Nibblex/argonaut-translator-cli/issues"

[project.scripts]
argonaut-cli = "argonaut_cli.cli:main"

[tool.setuptools.dynamic]
version = { attr = "argonaut_cli.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=argonaut_cli --cov-report=term-missing"

[tool.coverage.run]
source = ["argonaut_cli"]
# two lines that hand over to cli.main, which the suite calls directly
omit = ["*/argonaut_cli/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
